<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presentation_1 — Hi-Tech 3D Showcase</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="scene-canvas"></canvas>
  <div class="hud-corner tl"></div>
  <div class="hud-corner tr"></div>
  <div class="hud-corner bl"></div>
  <div class="hud-corner br"></div>

  <div id="loading-screen">
    <div class="loading-title">PRESENTATION<span>_1</span></div>
    <div class="loading-bar"><div id="loading-fill"></div></div>
    <div id="loading-text">// INITIALIZING SYSTEM…</div>
  </div>

  <div id="ui-root" class="hidden">
    <header class="hud-top">
      <div class="brand">PRESENTATION<span>_1</span></div>
      <div class="hud-actions">
        <button id="btn-play" class="icon-btn" title="Play Auto Presentation">▶</button>
        <button id="btn-mute" class="icon-btn" title="Mute / Unmute">🔊</button>
        <button id="btn-letterbox" class="icon-btn" title="Cinematic Letterbox">🎬</button>
        <button id="btn-shot" class="icon-btn" title="Capture Screenshot">📷</button>
      </div>
    </header>

    <div class="hud-bottom">
      <nav id="view-nav" class="hud-views"></nav>
      <div id="hint" class="hud-hint">Drag to look around · Scroll to zoom · Choose a view below</div>
    </div>

    <section id="gallery" class="film-gallery">
      <div class="film-gallery-label">Captured Shots</div>
      <div id="filmstrip" class="filmstrip"></div>
    </section>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
